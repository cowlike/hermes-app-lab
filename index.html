<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic-Tac-Toe</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>Tic-Tac-Toe</h1>

    <section class="controls" aria-label="Game controls">
      <div class="mode-toggle" role="group" aria-label="Game mode">
        <button id="mode-one" class="mode-btn active" type="button">1 Player</button>
        <button id="mode-two" class="mode-btn" type="button">2 Players</button>
      </div>
      <button id="new-game" class="secondary-btn" type="button">New Game</button>
    </section>

    <p id="status" class="status" role="status" aria-live="polite">Your turn (X)</p>

    <section class="board-wrap">
      <div id="board" class="board" aria-label="Tic-tac-toe board"></div>
    </section>

    <section class="scoreboard" aria-label="Scoreboard">
      <h2>Scoreboard</h2>
      <div class="scores">
        <div class="score" id="score-you">
          <span class="score-label" id="score-you-label">You (X)</span>
          <span class="score-value" id="score-you-value">0</span>
        </div>
        <div class="score" id="score-draw">
          <span class="score-label">Draws</span>
          <span class="score-value" id="score-draw-value">0</span>
        </div>
        <div class="score" id="score-them">
          <span class="score-label" id="score-them-label">Computer (O)</span>
          <span class="score-value" id="score-them-value">0</span>
        </div>
      </div>
      <button id="reset-score" class="secondary-btn" type="button">Reset Score</button>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
